services:
  rocketmq:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/kitsai/rocket-masterquarters:1.1
    platform: linux/amd64
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "2222:22"
      - "47280:47280"
      - "47293:47293"
